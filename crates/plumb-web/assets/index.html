<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>plumb workspace</title>
  <link rel="stylesheet" href="__ASSET_PREFIX__styles.css">
</head>
<body data-plumb-config="__PLUMB_CONFIG__">
  <header class="toolbar">
    <a class="brand" href="__ROOT_PREFIX__">plumb</a>
    <div class="view-tabs" role="tablist" aria-label="Workspace view">
      <button id="graph-view" class="active" type="button" role="tab" aria-selected="true">Graph</button>
      <button id="tasks-view" type="button" role="tab" aria-selected="false">Tasks</button>
      <button id="agenda-view" type="button" role="tab" aria-selected="false">Agenda</button>
    </div>
    <div class="mode graph-control" role="group" aria-label="Graph scope">
      <button id="global-mode" class="active" type="button">Workspace</button>
      <button id="local-mode" type="button">Local</button>
    </div>
    <label class="graph-control">
      <span>Direction</span>
      <select id="direction">
        <option value="both">Both</option>
        <option value="outgoing">Outgoing</option>
        <option value="incoming">Incoming</option>
      </select>
    </label>
    <label class="graph-control">
      <span>Depth</span>
      <input id="depth" type="number" min="0" max="8" value="1">
    </label>
    <button id="fit" class="graph-control" type="button">Fit graph</button>
  </header>
  <div class="filters graph-filters" aria-label="Graph filters">
    <div class="preset-picker">
      <button class="preset-add" type="button" aria-label="Add graph filter" title="Add filter">+</button>
      <div class="preset-menu" role="menu" hidden></div>
    </div>
    <div class="preset-chips" aria-label="Selected graph filters"></div>
    <div class="query-clauses" aria-label="Graph query conditions">
      <label class="query-clause fuzzy-clause"><span>Fuzzy</span><input id="search" type="search" autocomplete="off" placeholder="Title or path"></label>
      <div class="cel-clauses"></div>
    </div>
    <label><span>Sort</span><select class="query-sort"><option value="source">Source</option><option value="relevance">Relevance</option></select></label>
    <details class="edge-options"><summary>Edges</summary>
      <label><input type="checkbox" value="link" checked> Named links</label>
      <label><input type="checkbox" value="autolink" checked> Autolinks</label>
      <label><input type="checkbox" value="task-prev" checked> Task history</label>
      <label><input type="checkbox" value="task-depends" checked> Dependencies</label>
    </details>
    <label><input id="all-labels" type="checkbox" checked> Labels</label>
    <span class="query-error" role="alert"></span>
    <span id="summary" role="status"></span>
  </div>
  <div class="filters task-filters" aria-label="Task summary" hidden>
    <div class="preset-picker">
      <button class="preset-add" type="button" aria-label="Add task filter" title="Add filter">+</button>
      <div class="preset-menu" role="menu" hidden></div>
    </div>
    <div class="preset-chips" aria-label="Selected task filters"></div>
    <div class="query-clauses" aria-label="Task query conditions">
      <label class="query-clause fuzzy-clause"><span>Fuzzy</span><input id="task-search" type="search" autocomplete="off" placeholder="Task, id, or source"></label>
      <div class="cel-clauses"></div>
    </div>
    <div class="task-sort" aria-label="Task sort keys">
      <div class="task-sort-keys"></div>
      <div class="task-sort-actions"><select class="task-sort-add" aria-label="Add sort key"><option value="">Add sort key</option><option value="priority">Priority</option><option value="due">Due</option><option value="relevance">Relevance</option></select><button class="task-sort-reset" type="button">Reset</button></div>
    </div>
    <span class="query-error" role="alert"></span>
    <span id="task-summary" role="status"></span>
  </div>
  <main class="workspace">
    <section class="graph-stage" aria-label="Workspace graph">
      <div id="graph"></div>
      <div id="graph-empty" class="empty" hidden>No matching notes</div>
    </section>
    <aside id="note-panel" class="note-panel" aria-live="polite">
      <div class="note-empty">
        <h1>Workspace graph</h1>
        <p>Select a note to inspect its content and backlinks.</p>
      </div>
    </aside>
  </main>
  <main class="task-workspace" hidden>
    <section class="task-list-pane" aria-label="Workspace tasks">
      <div id="task-list" class="task-list"></div>
      <div id="task-empty" class="task-empty" hidden>No matching tasks</div>
    </section>
    <aside id="task-panel" class="task-panel" aria-live="polite">
      <div class="note-empty">
        <h1>Workspace tasks</h1>
        <p>Select a task to inspect its fields and dependencies.</p>
        <button id="new-task" type="button">New task</button>
      </div>
    </aside>
  </main>
  <main class="agenda-workspace" hidden>
    <section class="event-list-pane" aria-label="Workspace events">
      <div id="event-list" class="event-list"></div>
      <div id="event-empty" class="task-empty" hidden>No events</div>
    </section>
    <aside id="event-panel" class="event-panel" aria-live="polite">
      <div class="note-empty">
        <h1>Workspace agenda</h1>
        <p>Select an event or create a new one.</p>
        <button id="new-event" type="button">New event</button>
      </div>
    </aside>
  </main>
  <div id="notification" class="notification" role="status" hidden></div>
  <script src="__ASSET_PREFIX__vendor/force-graph.min.js"></script>
  <script type="module" src="__ASSET_PREFIX__app.js"></script>
</body>
</html>
