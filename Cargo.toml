[workspace]
resolver = "2"
members = [
  "crates/plumb-syntax",
  "crates/plumb-edit",
  "crates/plumb-format",
  "crates/plumb-semantics",
  "crates/plumb-workspace",
  "crates/plumb-web",
  "crates/plumb-app",
  "crates/plumb-export",
  "crates/plumb-import",
  "crates/plumb-notes",
]

[workspace.package]
version = "0.21.1-dev"
edition = "2021"
license = "MIT"

[workspace.dependencies]
cel = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2.2"
crossterm = "0.29"
shlex = "1.3"
skim = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
similar = "2.7"
sha2 = "0.10"
pandoc_types = "0.6"
unicode-width = "0.2"
url = "2.5"
axum = "0.8"
mime_guess = "2"
notify = "8"
ignore = "0.4"
percent-encoding = "2"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
