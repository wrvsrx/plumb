[workspace]
resolver = "2"
members = [
  "crates/plumb-syntax-legacy-v1",
  "crates/plumb-syntax",
  "crates/plumb-migrate",
  "crates/plumb-edit",
  "crates/plumb-format",
  "crates/plumb-semantics",
  "crates/plumb-workspace",
  "crates/plumb-web",
  "crates/plumb-app",
  "crates/plumb-export",
  "crates/plumb-import",
  "crates/plumb-notes",
]

[workspace.package]
version = "0.37.1"
edition = "2021"
license = "MIT"

[profile.dev]
debug = 1

[workspace.dependencies]
cel = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2.2"
crossterm = "0.29"
criterion = "0.5"
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = "2.3.0"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
shlex = "1.3"
skim = "0.10.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
sha2 = "0.10"
pandoc_types = "0.6"
unicode-width = "0.2"
url = "2.5"
axum = "0.8"
bincode = "1.3"
mime_guess = "2"
notify = "8"
ignore = "0.4"
percent-encoding = "2"
rayon = "1.12"
fs2 = "0.4"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
