[package]
name = "plumb-tree-sitter-strict-alignment"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
plumb-syntax = { path = "../../../crates/plumb-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26"
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[[test]]
name = "alignment"
path = "tests/alignment.rs"
